:root{
  box-sizing:border-box; color-scheme:dark;
  --main:#1E3E62; --deep:#0B192C; --black:#000000; --accent:#FF6500;
  --u:clamp(54px,calc(3.2vw + 40px),112px); --ink:#EEF3F9; --muted:#B7C5D8; --line:rgba(255,255,255,.14);
  --shadow:0 12px 32px rgba(0,0,0,.55);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--deep);color:var(--ink);font-family:"Peyda",Tahoma,"Segoe UI",sans-serif;line-height:1.8;padding-bottom:calc(var(--u)*1.7 + 28px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 48% at 4% 2%, #000000 0%, rgba(0,0,0,.85) 28%, transparent 74%),
    radial-gradient(52% 42% at 104% 102%, #000000 0%, rgba(0,0,0,.8) 30%, transparent 76%),
    radial-gradient(88% 66% at 74% 44%, #1E3E62 0%, #1E3E62 38%, rgba(30,62,98,.55) 62%, transparent 82%),
    radial-gradient(80% 60% at 20% 20%, #0B192C 0%, transparent 72%),
    #0B192C}
main{max-width:1100px;margin:0 auto;padding:28px 18px 0}
[hidden]{display:none!important}
.bar{height:5px;width:72px;border-radius:5px;background:var(--accent);margin:0 0 16px}
.lead{color:var(--ink);font-size:clamp(1.2rem,3.6vw,1.75rem);font-weight:700;line-height:1.7;margin:0 0 26px;max-width:36em}
.hero{min-height:calc(100vh - 210px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero h1{margin:0;font-weight:800;font-size:clamp(1.7rem,8.6vw,5.6rem);line-height:1.15;letter-spacing:.04em;direction:ltr;text-transform:uppercase}
.hero .bar{margin:22px 0 20px}
.about{color:var(--muted);max-width:40em;margin:0;font-size:clamp(1rem,2.6vw,1.15rem);white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--deep);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card:focus-visible,.dock button:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{display:block;width:100%;aspect-ratio:16/9}
.thumb svg{display:block;width:100%;height:100%}
.meta{display:block;padding:12px 14px 14px}
.meta b{display:block;font-weight:700}
.meta span{color:var(--muted);font-size:.86rem}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--deep);color:var(--ink);padding:0;width:min(640px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg-body{padding:16px 18px 20px}
.dlg-body h2{margin:12px 0 4px;font-size:1.3rem;font-weight:700}
.dlg-body p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;padding:0 20px;min-height:44px;border-radius:12px;background:var(--accent);color:#000;text-decoration:none;font-weight:800}
.close{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);margin-inline-start:8px;padding:0 16px}
.dock{position:fixed;inset-inline:0;bottom:calc(var(--u)*.24 + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock nav{pointer-events:auto;display:flex;gap:calc(var(--u)*.06);padding:calc(var(--u)*.11);border-radius:calc(var(--u)*.42);background:rgba(0,0,0,.72);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100vw - 16px);direction:ltr}
.dock button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.05);width:var(--u);min-width:0;flex:0 1 auto;height:max(46px,calc(var(--u)*.9));border-radius:calc(var(--u)*.3);color:var(--muted);font-size:max(11px,calc(var(--u)*.175));font-weight:700;line-height:1.2;transition:transform .18s,background .18s,color .18s}
.dock button svg{width:calc(var(--u)*.4);height:calc(var(--u)*.4);min-width:20px;min-height:20px}
.dock button:hover{transform:translateY(calc(var(--u)*-.07));color:var(--ink)}
.dock button[aria-current="page"]{color:var(--accent);background:var(--deep);transform:none;box-shadow:0 8px 18px rgba(255,101,0,.28),inset 0 0 0 1px rgba(255,101,0,.45)}

.pgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 18px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:block}
.pcard .poster{display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:transform .15s,border-color .15s,box-shadow .15s}
.pcard .poster svg{display:block;width:100%;height:100%}
.pcard:hover .poster{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.pcard:focus-visible .poster{outline:3px solid var(--accent);outline-offset:3px}
.cap{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.badge{flex:none;background:var(--accent);color:#000;font-weight:800;font-size:.74rem;padding:1px 11px;border-radius:999px;line-height:1.8;margin-top:2px}
.cap b{font-weight:700;font-size:.95rem;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dposter{display:block;width:calc(min(56vh,420px)*.8);max-width:100%;aspect-ratio:4/5;margin:0 auto;border-radius:12px;overflow:hidden}
.dposter svg{display:block;width:100%;height:100%}
.poster img,.poster video,.thumb img,.thumb video,.ath img,.ath video{display:block;width:100%;height:100%;object-fit:cover}
.dmedia{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:#000}
.adm{max-width:760px;margin:0 auto}
.adm h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;margin:0 0 6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px;direction:ltr}
.tab{all:unset;cursor:pointer;box-sizing:border-box;min-height:44px;padding:0 20px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-weight:700}
.tab[aria-current]{background:var(--accent);border-color:var(--accent);color:#000}
.aform{display:grid;gap:12px;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:16px}
.aform label{display:grid;gap:6px;font-size:.88rem;color:var(--muted)}
.aform input{width:100%;min-height:44px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit}
.aform input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.abtn{all:unset;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--accent);color:#000;font-weight:800}
.ast{color:var(--muted);min-height:1.7em;margin:12px 0}
.arow{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--deep);margin-bottom:10px}
.ath{flex:none;width:56px;height:56px;border-radius:10px;overflow:hidden;background:#000}
.ath i{display:block;width:100%;height:100%;background:linear-gradient(145deg,var(--main),var(--black))}
.atx{flex:1;min-width:0}.atx b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.atx small{color:var(--muted)}
.aops{display:flex;gap:6px;flex:none}
.aops button{all:unset;cursor:pointer;min-width:44px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-weight:700}
.aops button[data-a="del"]{color:var(--accent)}
.tab:focus-visible,.abtn:focus-visible,.aops button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.poster,.thumb{position:relative}
.poster img[data-yt],.thumb img[data-yt]{position:absolute;inset:0}
.pl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pl i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.28)}
.pl em{position:absolute;bottom:10px;inset-inline-start:10px;font-style:normal;font-size:.72rem;font-weight:700;padding:1px 10px;border-radius:999px;background:rgba(0,0,0,.65);color:var(--ink);direction:ltr}
.dframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.dframe.ig{aspect-ratio:auto;height:min(70vh,580px)}
.ap{display:block;min-height:1.4em;color:var(--accent);font-size:.82rem}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{all:unset;cursor:pointer;box-sizing:border-box;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-weight:700;color:var(--ink);transition:background .15s,border-color .15s}

function vid(u){
  u=u||""; var m;
  if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/i)))
    return {id:m[1],yt:1,name:"YouTube",embed:"https://www.youtube-nocookie.com/embed/"+m[1]+"?autoplay=1&rel=0"};
  if((m=u.match(/aparat\.com\/v\/(\w+)/i)))
    return {id:m[1],name:"آپارات",embed:"https://www.aparat.com/video/video/embed/videohash/"+m[1]+"/vt/frame"};
  if((m=u.match(/instagram\.com\/(p|reels?|tv)\/([\w-]+)/i)))
    return {id:m[2],ig:1,name:"Instagram",embed:"https://www.instagram.com/"+(m[1].indexOf("reel")===0?"reel":"p")+"/"+m[2]+"/embed"};
  return null;
}

  return '<span class="pl"><i><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#FF6500"/></svg></i><em>'+v.name+'</em></span>';

function cover(s,i,it,isPoster){
  var base=isPoster?poster(s,i):thumb(s,i), v=vid(it.url);
  if(v&&!(it.a&&it.a.k==="v")){
    if(it.a) return media(it)+playBadge(v);
    return base+(v.yt?'<img data-yt src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" alt="">':'')+playBadge(v);
  }
  return media(it)||base;
}
function renderGrid(){
  var s=cur, items=itemsOf(s);
  grid.className="grid"+(s.poster?" pgrid":"");
  grid.innerHTML="";

  if(!shown.length){ grid.innerHTML='<p style="grid-column:1/-1;color:var(--muted);margin:0">'+(items.length?"نمونه‌ای در این دسته نیست":"نمونه‌ای اضافه نشده")+'</p>'; return; }

    if(flt!=="all"&&it.c!==flt) return;
    var c=document.createElement("button"); c.type="button";
    if(s.poster){
      c.className="pcard";
      c.innerHTML='<span class="poster">'+cover(s,i,it,1)+'</span><span class="cap">'+(it.g?'<span class="badge">'+esc(it.g)+'</span>':'')+'<b>'+esc(it.t)+'</b></span>';

      c.innerHTML='<span class="thumb">'+cover(s,i,it,0)+'</span><span class="meta"><b>'+esc(it.t)+'</b><span>'+esc(it.d)+'</span></span>';

  document.title=(isAdmin?"Admin":s.name)+" | Portfolio";
  document.getElementById("homeView").hidden=!isHome;
  document.getElementById("sectionView").hidden=isHome||isAdmin;
  document.getElementById("adminView").hidden=!isAdmin;
  Array.prototype.forEach.call(dock.children,function(b){
    if(!isAdmin&&b.dataset.id===s.id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(isAdmin){ renderAdmin(); }
  else if(isHome){ document.getElementById("about").textContent=s.about; }
  else{ document.getElementById("lead").textContent=s.lead; if(show.last!==s.id) flt="all"; show.last=s.id; renderFlt(); renderGrid(); }
  window.scrollTo(0,0);
}

function openItem(s,i){
  var it=itemsOf(s)[i], url=safeUrl(it.url), u=it.a?"/_blob/"+encodeURIComponent(it.a.id):"", v=vid(it.url), pic;
  if(v&&!(it.a&&it.a.k==="v")) pic='<iframe class="dframe'+(v.ig?' ig':'')+'" src="'+esc(v.embed)+'" title="'+esc(it.t)+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  else if(it.a) pic=it.a.k==="v"?'<video class="dmedia" controls playsinline src="'+u+'"></video>':'<img class="dmedia" src="'+u+'" alt="">';
  else pic=s.poster?'<span class="dposter">'+poster(s,i)+'</span>':'<span class="thumb" style="border-radius:12px;overflow:hidden">'+thumb(s,i)+'</span>';
  document.getElementById("dlgBody").innerHTML=pic+'<h2>'+esc(it.t)+'</h2><p>'+esc(it.d)+'</p>'+
    (url?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">'+(v?"مشاهده در "+v.name:"مشاهده نمونه")+'</a>':'')+'<button class="close" type="button" id="cl">بستن</button>';

}

async function checkAccess(){
  if(access!==null) return access;
  try{
    if(!window.claude||!claude.use){ access=false; return false; }

}
function row(it,i){
  var pv=vid(it.url), k=pv?pv.name:it.a?(it.a.k==="v"?"ویدیو":"تصویر"):(it.url?"لینک":"نمونه");
  return '<div class="arow"><span class="ath">'+(media(it)||"<i></i>")+'</span><span class="atx"><b>'+esc(it.t)+'</b><small>'+k+'</small>'+(it.c?'<em>'+catName(it.c)+'</em>':'')+'</span><span class="aops"><button type="button" data-a="cat" data-v="'+i+'" aria-label="تغییر دسته">'+(it.c?catName(it.c):"بدون دسته")+'</button><button type="button" data-a="up" data-v="'+i+'" aria-label="بالا">↑</button><button type="button" data-a="down" data-v="'+i+'" aria-label="پایین">↓</button><button type="button" data-a="del" data-v="'+i+'">حذف</button></span></div>';
}
function renderAdmin(){
  if(access===null){ adminBody.innerHTML='<p class="about">در حال بررسی دسترسی…</p>'; checkAccess().then(function(){ if(location.hash==="#admin") renderAdmin(); }); return; }
  if(!access){ adminBody.innerHTML='<p class="about">این بخش فقط برای صاحب صفحه است. با حساب کاربری که این صفحه را ساخته وارد شو و دوباره #admin را باز کن.</p>'; return; }
  var s=secOf(ad.tab)||secOf("motion"), items=itemsOf(s);
  var h='<div class="tabs">'+SECTIONS.filter(function(x){return x.id!=="home"}).map(function(x){
    return '<button type="button" class="tab" data-a="tab" data-v="'+x.id+'"'+(x.id===s.id?' aria-current="true"':'')+'>'+x.name+'</button>';}).join("")+'</div>';
  h+='<div class="aform"><b>افزودن نمونه به '+s.name+'</b>'+
    '<label>فایل (عکس یا ویدیو؛ برای لینک، عکس کاور)<input type="file" id="af" accept="image/*,video/*"></label>'+
    '<label>عنوان<input type="text" id="at"></label>'+
    (s.poster?'<label>برچسب کوچک (مثلاً تیزر)<input type="text" id="ag"></label>':'')+
    '<label>دسته<select id="ac"><option value="">بدون دسته</option>'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>'}).join("")+'</select></label>'+
    '<label>توضیح کوتاه<input type="text" id="ad"></label>'+
    '<label>لینک (یوتیوب، اینستاگرام، آپارات یا هر لینک دیگر؛ اختیاری)<input type="url" id="au" dir="ltr" placeholder="https://"><span class="ap" id="ap"></span></label>'+
    '<button class="abtn" type="button" data-a="add">افزودن</button></div>'+
    '<p class="ast" id="ast" role="status">'+esc(ad.st)+'</p><div>'+(items.length?items.map(row).join(""):'<p class="about">هنوز نمونه‌ای نیست</p>')+'</div>';
  adminBody.innerHTML=h;
}
async function commit(fn){
  var snap=JSON.stringify(store);
  try{
    fn();
    say("در حال ذخیره… صفحه دوباره بارگذاری می‌شود");
    try{ sessionStorage.setItem("tab",ad.tab); }catch(e){}
    await ad.P.publish(page());
  }catch(e){
    store=JSON.parse(snap);
    say(e&&e.code==="conflict"?"":"ذخیره نشد: "+((e&&e.code)||""));
    if(e&&e.code!=="conflict") renderAdmin();
  }
}
async function addItem(){
  var f=document.getElementById("af").files[0], t=val("at"), g=val("ag"), d=val("ad"), u=val("au"), a=null;
  if(!t){ say("عنوان را بنویس"); return; }
  if(!f&&!u){ say("فایل یا لینک لازم است"); return; }
  if(u&&!/^https?:\/\//i.test(u)) u="https://"+u;
  ad.busy=true;
  try{
    if(f){ say("در حال آپلود… (ویدیو ممکن است کمی طول بکشد)"); var r=await ad.A.upload(f); a={k:f.type.indexOf("video")===0?"v":"i",id:r.id}; }
  }catch(e){ ad.busy=false; say("آپلود نشد: "+((e&&e.code)||"")); return; }
  var it={t:t,d:d,url:u}; var cc=val("ac"); if(cc) it.c=cc; if(g) it.g=g; if(a) it.a=a;
  await commit(function(){ listOf(ad.tab).push(it); });
  ad.busy=false;
}
adminBody.addEventListener("input",function(e){
  if(e.target.id!=="au") return;
  var v=vid(e.target.value), p=document.getElementById("ap");
  if(p) p.textContent=v?"تشخیص داده شد: "+v.name+" ✓":"";
});
adminBody.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b||ad.busy) return;
  var a=b.dataset.a, v=b.dataset.v;
  if(a==="tab"){ ad.tab=v; ad.st=""; renderAdmin(); }
  else if(a==="add"){ addItem(); }
  else{
    ad.busy=true;
    commit(function(){
      var L=listOf(ad.tab), i=+v;
      if(a==="del"){ L.splice(i,1); return; }
      if(a==="cat"){ var o=["",  "cul","com"], n=(o.indexOf(L[i].c||"")+1)%3; if(o[n]) L[i].c=o[n]; else delete L[i].c; return; }
      var j=a==="up"?i-1:i+1; if(j<0||j>=L.length) return;
      var x=L[i]; L[i]=L[j]; L[j]=x;
    }).then(function(){ ad.busy=false; });
  }
});

dlg.addEventListener("click",function(e){ if(e.target===dlg) dlg.close(); });

function route(){ show((location.hash||"").replace("#","")); }
window.addEventListener("hashchange",route);
route();
</script>
</body>
